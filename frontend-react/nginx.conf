server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application React (SPA) : toute route inconnue retombe sur index.html pour
    # laisser React Router gerer le routage cote client (ex: /produits, /ventes...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite hashes dans le nom de fichier : cache long terme sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
