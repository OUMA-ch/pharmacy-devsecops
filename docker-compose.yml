version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pharmacy-backend
    restart: always
    environment:
      DB_HOST: ep-patient-butterfly-b1bs8i0v-pooler.c-5.eu-central-1.aws.neon.tech
      DB_PORT: 5432
      DB_NAME: neondb
      DB_USER: neondb_owner
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: require
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: pharmacy-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: pharmacy-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus