version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pharmacy-backend
    restart: always
    environment:
      DB_HOST: ep-patient-butterfly-b1bs8i0v-pooler.c-5.eu-central-1.aws.neon.tech
      DB_PORT: 5432
      DB_NAME: neondb
      DB_USER: neondb_owner
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: require
      # JWT_SECRET est obligatoire (aucune valeur par defaut, voir README-SECURITY.md
      # du backend) : generer avec `openssl rand -base64 32` et exporter avant de
      # lancer `docker-compose up`.
      JWT_SECRET: ${JWT_SECRET}
      # Backend/frontend testes en HTTP simple en local : cookie Secure desactive.
      # Remettre a "true" (ou retirer, c'est deja la valeur par defaut) en production HTTPS.
      SECURITY_COOKIE_SECURE: ${SECURITY_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend-react
      args:
        # Vite integre cette valeur dans le bundle JS au moment du build (pas au
        # demarrage du container) : c'est l'URL que le NAVIGATEUR de l'utilisateur
        # doit utiliser pour joindre le backend, donc localhost:8080 (le port publie
        # ci-dessus), pas un nom d'hote interne au reseau docker-compose.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: pharmacy-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: pharmacy-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: pharmacy-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus