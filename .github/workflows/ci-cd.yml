name: CI - Build, Test, Quality and Security

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestion_pharmacie
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 2130
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache des dépendances Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compiler, tester et vérifier la couverture (JaCoCo)
        working-directory: ./backend
        run: mvn clean verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gestion_pharmacie
          DB_USER: postgres
          DB_PASSWORD: 2130
          DB_SSLMODE: disable
          JWT_SECRET: ci-test-secret-not-for-production-use-only-32chars

      - name: Installer Java 21 pour SonarCloud
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Analyse SonarCloud
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn sonar:sonar
          -Dsonar.projectKey=OUMA-ch_pharmacy-devsecops
          -Dsonar.organization=ouma-ch
          -Dsonar.host.url=https://sonarcloud.io

      - name: Publier le rapport de couverture JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-jacoco
          path: backend/target/site/jacoco/

      - name: Construire l'image Docker
        working-directory: ./backend
        run: docker build -t pharmacy-backend:${{ github.sha }} .

      - name: Scanner l'image avec Trivy (vulnérabilités critiques et hautes)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'pharmacy-backend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'backend/.trivyignore'

      - name: Scanner l'image avec Trivy (rapport complet, informatif)
        uses: aquasecurity/trivy-action@0.35.0
        if: always()
        with:
          image-ref: 'pharmacy-backend:${{ github.sha }}'
          format: 'table'
          severity: 'LOW,MEDIUM,CRITICAL,HIGH'
          exit-code: '0'
          trivyignores: 'backend/.trivyignore'
          output: 'trivy-full-report.txt'

      - name: Connexion à Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag et publication de l'image sur Docker Hub
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag pharmacy-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:${{ github.sha }}
          docker tag pharmacy-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest

      - name: Publier le rapport Trivy complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy-complet
          path: trivy-full-report.txt

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: ./frontend-react
        run: npm ci

      - name: Audit des dépendances npm de production (frontend)
        # --omit=dev : les vulnerabilites des devDependencies (vite/vitest, outils
        # de build) ne concernent pas le code expedie dans l'image Docker finale
        # (nginx + bundle statique) - elles sont deja couvertes differemment par
        # le scan Trivy de l'image ci-dessous. Sans --omit=dev, cette etape
        # echouerait des maintenant sur des CVE vite/vitest qui n'affectent pas
        # les utilisateurs de l'app (a corriger separement, via mise a jour de
        # ces outils, sans lien avec la securite runtime).
        working-directory: ./frontend-react
        run: npm audit --omit=dev --audit-level=high

      - name: Construire l'image Docker du frontend
        working-directory: ./frontend-react
        run: docker build -t pharmacy-frontend:${{ github.sha }} .

      - name: Scanner l'image frontend avec Trivy (vulnérabilités critiques et hautes)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'pharmacy-frontend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'frontend-react/.trivyignore'

      - name: Scanner l'image frontend avec Trivy (rapport complet, informatif)
        uses: aquasecurity/trivy-action@0.35.0
        if: always()
        with:
          image-ref: 'pharmacy-frontend:${{ github.sha }}'
          format: 'table'
          severity: 'LOW,MEDIUM,CRITICAL,HIGH'
          exit-code: '0'
          trivyignores: 'frontend-react/.trivyignore'
          output: 'trivy-frontend-full-report.txt'

      - name: Publier le rapport Trivy complet (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy-complet-frontend
          path: trivy-frontend-full-report.txt