name: CI - Build, Test, Quality and Security

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 2130
          MYSQL_DATABASE: gestion_pharmacie
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache des dépendances Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compiler, tester et vérifier la couverture (JaCoCo)
        working-directory: ./backend
        run: mvn clean verify
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: gestion_pharmacie
          DB_USER: root
          DB_PASSWORD: 2130

      - name: Publier le rapport de couverture JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-jacoco
          path: backend/target/site/jacoco/

      - name: Construire l'image Docker
        working-directory: ./backend
        run: docker build -t pharmacy-backend:${{ github.sha }} .

      - name: Scanner l'image avec Trivy (vulnérabilités critiques et hautes)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'pharmacy-backend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'backend/.trivyignore'

      - name: Scanner l'image avec Trivy (rapport complet, informatif)
        uses: aquasecurity/trivy-action@0.35.0
        if: always()
        with:
          image-ref: 'pharmacy-backend:${{ github.sha }}'
          format: 'table'
          severity: 'LOW,MEDIUM,CRITICAL,HIGH'
          exit-code: '0'
          output: 'trivy-full-report.txt'
          trivyignores: 'backend/.trivyignore'

      - name: Connexion à Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag et publication de l'image sur Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag pharmacy-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:${{ github.sha }}
          docker tag pharmacy-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest
      - name: Publier le rapport Trivy complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy-complet
          path: trivy-full-report.txt