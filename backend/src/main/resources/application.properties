spring.application.name=mini_projet_pharmacie

# ===============================
#   CONFIGURATION DE LA BDD POSTGRESQL (NEON)
# ===============================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion_pharmacie}?sslmode=require

spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2130}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
#          JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl


# ===============================
#       SPRING SECURITY
# ===============================

spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}


# ===============================
#        SERVER CONFIG
# ===============================

server.port=${SERVER_PORT:8080}


# ===============================
#        ACTUATOR (monitoring)
# ===============================

management.endpoints.web.exposure.include=health