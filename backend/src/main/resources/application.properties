spring.application.name=mini_projet_pharmacie

# ===============================
#   CONFIGURATION DE LA BDD POSTGRESQL (NEON)
# ===============================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion_pharmacie}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2130}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
#          JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl


# ===============================
#       SPRING SECURITY
# ===============================

spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

# JWT de session (voir security/JwtService.java et README-SECURITY.md).
# AUCUNE valeur par defaut pour le secret : demarrage en echec plutot qu'un
# secret faible oublie en production. Generer avec : openssl rand -base64 32
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Cookie "access_token" : Secure=true par defaut (necessite HTTPS). Ne mettre a
# false que pour un test HTTP local hors exception navigateur "localhost".
security.cookie.secure=${SECURITY_COOKIE_SECURE:true}

# SameSite du cookie "access_token" : Strict par defaut (dev, backend/frontend
# sur le meme site navigateur). Passer a None en production si frontend et
# backend sont sur des sous-domaines differents (voir AuthController.java) -
# exige security.cookie.secure=true.
security.cookie.same-site=${SECURITY_COOKIE_SAMESITE:Strict}

# Origines autorisees a envoyer des requetes CORS avec cookies (voir WebConfig.java).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000}


# ===============================
#        SERVER CONFIG
# ===============================

server.port=${SERVER_PORT:8080}


# ===============================
#        ACTUATOR (monitoring)
# ===============================

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always